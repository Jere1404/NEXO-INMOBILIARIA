name: Deploy nexo-property-image

# Manual only: never deploy on push, pull_request or a schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexo-property-image-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Jere1404/NEXO-INMOBILIARIA'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.122.0

      - name: Install processor dependencies from lockfile
        run: npm ci --prefix supabase/functions --ignore-scripts --no-audit --no-fund

      - name: Regenerate ignored WASM
        run: node scripts/prepare-image-function.mjs

      - name: Verify package and private function configuration
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, tomllib
          root = pathlib.Path.cwd().resolve()
          config = tomllib.loads((root / 'supabase/config.toml').read_text())['functions']['nexo-property-image']
          assert config['verify_jwt'] is False, 'JWT configuration changed; review Auth checks first'
          assert config['entrypoint'] == './functions/nexo-property-image/index.js'
          expected = {
              './functions/nexo-property-image/magick.wasm',
              './functions/nexo-property-image/MAGICK-LICENSE',
              './functions/nexo-property-image/MAGICK-NOTICE',
          }
          assert set(config['static_files']) == expected, 'Unexpected or missing static files'
          files = [root / 'supabase' / config['entrypoint']]
          files += [root / 'supabase' / name for name in config['static_files']]
          files += [root / 'supabase/functions/_shared' / name for name in ['handler.mjs', 'image-pipeline.mjs', 'magick-codec.mjs']]
          files += [root / 'supabase/functions/nexo-property-image' / name for name in ['deno.json', 'deno.lock']]
          for file in files:
              assert file.is_file() and file.resolve().is_relative_to(root), 'Missing or external package file'
          function_dir = root / 'supabase/functions/nexo-property-image'
          assert json.loads((function_dir / 'deno.json').read_text())['lock'] == './deno.lock'
          package_dir = root / 'supabase/functions/node_modules/@imagemagick/magick-wasm'
          assert json.loads((package_dir / 'package.json').read_text())['version'] == '0.0.45'
          wasm = (function_dir / 'magick.wasm').read_bytes()
          assert wasm[:4] == b'\x00asm' and wasm == (package_dir / 'dist/x86/magick.wasm').read_bytes()
          print(f'Package verified: {len(files)} files; WASM {len(wasm)} bytes; SHA-256 {hashlib.sha256(wasm).hexdigest()}')
          PY

      - name: Test processor and authorization boundary
        run: npm test --prefix supabase/functions

      - name: Verify Docker daemon and bundling guard
        run: |
          docker info --format '{{.ServerVersion}}'
          node --test scripts/tests/image-function-bundle.test.mjs
          python3 -B -m unittest discover -s scripts/tests -p 'test_deploy_image_function_docker.py'

      - name: Build and measure actual bundle locally without deployment
        run: python3 -B scripts/deploy-image-function-docker.py

      - name: Deploy only nexo-property-image and verify active status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo '::error::Configure the SUPABASE_ACCESS_TOKEN Actions secret before running this workflow.'
            exit 1
          fi
          # Internally invokes CLI 2.122.0 with --use-docker. The loopback guard
          # blocks source API fallback and validates the actual ESZIP/EZBR before forwarding.
          python3 -B scripts/deploy-image-function-docker.py --deploy
          python3 - <<'PY'
          import json, os, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          request = urllib.request.Request(
              'https://api.supabase.com/v1/projects/ugrqstsuhamjjewusigh/functions',
              headers={'Authorization': 'Bearer ' + os.environ['SUPABASE_ACCESS_TOKEN'], 'Accept': 'application/json'},
              method='GET',
          )
          with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
              functions = json.load(response)
          function = next((item for item in functions if item.get('slug') == 'nexo-property-image'), None)
          assert function is not None, 'Deployment returned, but target function was not found'
          assert function.get('status') == 'ACTIVE', 'Target function is not ACTIVE'
          assert function.get('verify_jwt') is False, 'Remote JWT configuration differs from reviewed configuration'
          print('Verified nexo-property-image: ACTIVE; verify_jwt=false; version=' + str(function.get('version')))
          PY
